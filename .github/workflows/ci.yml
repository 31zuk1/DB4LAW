name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  audit:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run Vault audit
        run: |
          python scripts/qa/audit_vault.py \
            --vault ./Vault \
            --targets targets.yaml \
            --report-only

      - name: Check audit results
        run: |
          python << 'EOF'
          import json
          import sys

          with open('Vault/reports/audit_report.json') as f:
              data = json.load(f)

          issues = data.get('issues', [])

          # Count by severity (excluding provenance commit mismatch which is expected in CI)
          critical = [i for i in issues
                      if i.get('severity') == 'critical'
                      and 'Commit mismatch' not in i.get('message', '')]

          # Count scope leak issues
          scope_leaks = [i for i in issues
                         if i.get('category') == 'regression'
                         and 'scope' in i.get('message', '').lower()]

          print(f"Critical issues (excl. commit mismatch): {len(critical)}")
          print(f"Scope leak issues: {len(scope_leaks)}")

          if critical:
              print("\n❌ Critical issues found:")
              for c in critical:
                  print(f"  - {c['file_path']}: {c['message']}")
              sys.exit(1)

          if scope_leaks:
              print("\n❌ Scope leak issues found:")
              for s in scope_leaks:
                  print(f"  - {s['file_path']}: {s['message']}")
              sys.exit(1)

          print("\n✅ No critical or scope leak issues")
          EOF

      - name: Run WikiLink check
        run: |
          python scripts/qa/check_wikilinks.py \
            --vault ./Vault \
            --only-prefix laws/ || true

      - name: Check WikiLink results
        run: |
          python << 'EOF'
          import json
          import sys
          from pathlib import Path

          report_path = Path('Vault/reports/link_check_broken.json')
          if not report_path.exists():
              print("⚠️ WikiLink report not found - skipping check")
              sys.exit(0)

          with open(report_path) as f:
              data = json.load(f)

          broken_count = data.get('broken_count', 0)
          expected_broken = 3  # Future articles in 会社法

          print(f"Broken links: {broken_count}")
          print(f"Expected: {expected_broken}")

          if broken_count > expected_broken:
              print(f"\n❌ Found {broken_count} broken links (expected: {expected_broken})")
              # Show the extra broken links
              for link in data.get('broken_links', [])[:10]:
                  print(f"  - {link.get('source_file')}: {link.get('target_path')}")
              sys.exit(1)

          print(f"\n✅ Broken link count within expected range")
          EOF

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-reports
          path: |
            Vault/reports/audit_report.md
            Vault/reports/audit_report.json
            Vault/reports/link_check_broken.md
            Vault/reports/link_check_broken.json
